name: Release

on:
  push:
    tags: ["v*"]

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  build-gate:
    name: Build gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Offline release acceptance
        run: python3 scripts/ci/run.py --lane release

  publish:
    name: Publish release
    needs: build-gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create source tarball
        run: >
          git archive
          --format=tar.gz
          --prefix="holonightd-${VERSION}/"
          -o "holonightd-${VERSION}.tar.gz"
          HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "holonightd-${VERSION}.tar.gz"
          --generate-notes
