version: '3'
vars:
  BUILD_DIR: build/debug
  RELEASE_BUILD_DIR: build/release
  NPROC:
    sh: nproc
  PRESET: '{{default "debug" .PRESET}}'
tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  default:
    desc: Build the project
    cmds:
    - task: build
  configure:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset {{.PRESET}}
  configure:release:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset release
  configure-tests:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset test
  configure-coverage:
    desc: Configure coverage preset
    cmds:
    - python3 tooling/workflow.py configure --preset coverage
  build:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset {{.PRESET}}
  build:release:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset release
  run:
    desc: Build and run holonightd once with example config
    deps:
    - build
    cmds:
    - ./{{.BUILD_DIR}}/apps/healthd/holonight-healthd --once --config config/holonightd.example.toml
  install:local:
    desc: Build and install to ~/.local
    cmds:
    - cmake -S . -B {{.RELEASE_BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=$HOME/.local
    - cmake --build {{.RELEASE_BUILD_DIR}} -j{{.NPROC}}
    - cmake --install {{.RELEASE_BUILD_DIR}} --prefix $HOME/.local
  install:system:
    desc: Install to /usr (requires sudo)
    cmds:
    - cmake -S . -B {{.RELEASE_BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=/usr
    - cmake --build {{.RELEASE_BUILD_DIR}} -j{{.NPROC}}
    - sudo cmake --install {{.RELEASE_BUILD_DIR}} --prefix /usr
  test:
    desc: test using standalone tooling
    cmds:
    - python3 tooling/workflow.py test --preset {{.PRESET}}
  coverage:
    desc: Build coverage report
    cmds:
    - task: configure-coverage
    - cmake --build build/coverage --target coverage
  format:
    desc: format using standalone tooling
    cmds:
    - python3 tooling/workflow.py format
  format-check:
    desc: format-check using standalone tooling
    cmds:
    - python3 tooling/workflow.py format-check
  tidy:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope all
  tidy-src:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope src
  tidy-tests:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope tests
  tidy-container:
    desc: Run static checks inside the CI container (Docker/Podman) for predictable results
    cmds:
    - "if command -v docker >/dev/null 2>&1; then\n  CONTAINER_RUNNER=\"docker\"\nelif command -v podman >/dev/null 2>&1;\
      \ then\n  CONTAINER_RUNNER=\"podman\"\nelse\n  echo \"ERROR: Neither docker nor podman is available.\" >&2\n  exit 1\n\
      fi\n$CONTAINER_RUNNER run --rm -v \"$(pwd):/workspace\" -w /workspace ghcr.io/lebedenko/holonightd-ci:latest bash -c\
      \ \"\n  rm -rf build-ci-check &&\n  cmake -B build-ci-check -G Ninja -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON\
      \ -DBUILD_TESTS=ON &&\n  cmake --build build-ci-check --target format-check &&\n  cmake --build build-ci-check --target\
      \ tidy\n\"\n"
  build-ci-image:
    desc: Build the CI container image locally
    cmds:
    - "if command -v docker >/dev/null 2>&1; then\n  CONTAINER_RUNNER=\"docker\"\nelif command -v podman >/dev/null 2>&1;\
      \ then\n  CONTAINER_RUNNER=\"podman\"\nelse\n  echo \"ERROR: Neither docker nor podman is available.\" >&2\n  exit 1\n\
      fi\n$CONTAINER_RUNNER build -t ghcr.io/lebedenko/holonightd-ci:latest -f Dockerfile.ci .\n"
  clean:
    desc: Remove the build directory
    cmds:
    - rm -rf {{.BUILD_DIR}}
    prompt: Remove {{.BUILD_DIR}}/ entirely?
  clean-artifacts:
    desc: Remove ignored local build directories and root log files
    cmds:
    - scripts/clean-artifacts.sh --delete
    prompt: Remove ignored local build directories and root log files?
  tooling:doctor:
    desc: doctor using standalone tooling
    cmds:
    - python3 tooling/workflow.py doctor
  tooling:refresh:
    desc: refresh using standalone tooling
    cmds:
    - python3 tooling/workflow.py refresh --preset {{default "test" .EDITOR_PRESET}}
  serena:serve:
    desc: Start independent Serena server in codex context
    cmds:
    - serena start-mcp-server --project "{{.TASKFILE_DIR}}" --context codex
  serena:index:
    desc: Explicitly index this module
    cmds:
    - serena project index "{{.TASKFILE_DIR}}"
  deps:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps --preset {{.PRESET}}
  lint:
    desc: Run applicable static checks
    cmds:
    - task: tidy
  check:
    desc: Run build, tests and static checks
    cmds:
    - task: build
    - task: test
    - task: format-check
    - task: lint
