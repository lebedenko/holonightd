version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
  BUILD_DIR: build/{{.PRESET}}
  RELEASE_BUILD_DIR: build/release
  NPROC:
    sh: nproc
tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  default:
    desc: Build the project
    cmds:
    - task: build
  run:
    desc: Build and run holonightd once with example config
    deps:
    - build
    cmds:
    - ./{{.BUILD_DIR}}/apps/healthd/holonight-healthd --once --config config/holonightd.example.toml
  install:local:
    desc: Build and install to ~/.local
    cmds:
    - cmake -S . -B {{.RELEASE_BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=$HOME/.local
    - cmake --build {{.RELEASE_BUILD_DIR}} -j{{.NPROC}}
    - cmake --install {{.RELEASE_BUILD_DIR}} --prefix $HOME/.local
  install:system:
    desc: Install to /usr (requires sudo)
    cmds:
    - cmake -S . -B {{.RELEASE_BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=/usr
    - cmake --build {{.RELEASE_BUILD_DIR}} -j{{.NPROC}}
    - sudo cmake --install {{.RELEASE_BUILD_DIR}} --prefix /usr
  clean:
    desc: Remove the build directory
    cmds:
    - rm -rf {{.BUILD_DIR}}
    prompt: Remove {{.BUILD_DIR}}/ entirely?
  clean-artifacts:
    desc: Remove ignored local build directories and root log files
    cmds:
    - scripts/clean-artifacts.sh --delete
    prompt: Remove ignored local build directories and root log files?
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
  coverage:
    desc: Build and run tests, then generate the coverage report
    cmds:
    - cmake --preset dev -B build/coverage -DENABLE_COVERAGE=ON
    - cmake --build build/coverage
    - ctest --test-dir build/coverage --output-on-failure --no-tests=error
    - cmake --build build/coverage --target coverage
